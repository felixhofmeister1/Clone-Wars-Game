<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Family Portal</title>
  <meta name="description" content="Your family's shared calendar, group chat, kudos board, shop and multiplayer arcade.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fff8f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15110e" media="(prefers-color-scheme: dark)">

  <!-- Installable app (Android / desktop Chrome / Edge) -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Family Portal">

  <!-- iOS / iPadOS Safari "Add to Home Screen" -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Family">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800;900&display=swap">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/games.css">

  <!-- Third-party modules come from the CDN; both load lazily and the app degrades gracefully without them. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/+esm"
      }
    }
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <div class="splash" role="status">
      <img class="splash__logo" src="icons/icon.svg" alt="" width="84" height="84">
      <p class="splash__text">Loading Family Portal…</p>
    </div>
  </div>
  <noscript>
    <p style="padding:24px;font-family:system-ui;text-align:center">Family Portal needs JavaScript. Please enable it and reload.</p>
  </noscript>
</body>
</html>
