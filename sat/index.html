<!DOCTYPE html>
<html lang="en" data-theme="frutiger-aero">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#5ecbf5">
  <title>SAT Studio: Digital SAT Practice</title>
  <meta name="description" content="Full-length adaptive Digital SAT practice tests, skill practice for every domain and subdomain, explanations, and built-in study tools.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link id="theme-fonts" rel="stylesheet" href="">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/themes.css">
</head>
<body>
  <!-- Theme decoration layer (bubbles, landscapes, aurora, grids...) -->
  <div id="bg" aria-hidden="true"></div>

  <header id="appbar">
    <a class="brand" href="#/home" aria-label="SAT Studio home">
      <span class="brand-mark">S</span>
      <span class="brand-name">SAT Studio</span>
    </a>
    <nav id="mainnav" aria-label="Main">
      <a href="#/home" data-nav="home"><i data-icon="home"></i><span>Home</span></a>
      <a href="#/tests" data-nav="tests"><i data-icon="clipboard"></i><span>Tests</span></a>
      <a href="#/practice" data-nav="practice"><i data-icon="target"></i><span>Practice</span></a>
      <a href="#/learn" data-nav="learn"><i data-icon="book"></i><span>Learn</span></a>
      <a href="#/tools" data-nav="tools"><i data-icon="tool"></i><span>Tools</span></a>
      <a href="#/progress" data-nav="progress"><i data-icon="chart"></i><span>Progress</span></a>
      <a href="#/settings" data-nav="settings"><i data-icon="gear"></i><span>Settings</span></a>
    </nav>
    <button id="theme-quick" class="icon-btn" title="Change style" aria-label="Change style"><i data-icon="palette"></i></button>
  </header>

  <main id="view" tabindex="-1"></main>

  <!-- Floating tool windows (calculator, dictionary, reference, scratchpad...) -->
  <div id="windows"></div>
  <!-- Modals, popovers, toasts -->
  <div id="overlay-root"></div>
  <div id="toasts" aria-live="polite"></div>

  <noscript><p style="padding:2rem">SAT Studio needs JavaScript to run.</p></noscript>

  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/katex/auto-render.min.js"></script>

  <script src="js/core.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/figures.js"></script>

  <script src="js/math/mathgen.js"></script>
  <script src="js/math/gen-algebra.js"></script>
  <script src="js/math/gen-advanced.js"></script>
  <script src="js/math/gen-psda.js"></script>
  <script src="js/math/gen-geometry.js"></script>

  <script src="js/data/rw-practice-cs.js"></script>
  <script src="js/data/rw-practice-ii.js"></script>
  <script src="js/data/rw-practice-sec.js"></script>
  <script src="js/data/rw-practice-eoi.js"></script>
  <script src="js/data/rw-test1-m1.js"></script>
  <script src="js/data/rw-test1-m2e.js"></script>
  <script src="js/data/rw-test1-m2h.js"></script>
  <script src="js/data/rw-test2-m1.js"></script>
  <script src="js/data/rw-test2-m2e.js"></script>
  <script src="js/data/rw-test2-m2h.js"></script>
  <script src="js/data/lessons.js"></script>
  <script src="js/data/vocab.js"></script>

  <script src="js/bank.js"></script>
  <script src="js/tests.js"></script>
  <script src="js/qview.js"></script>

  <script src="js/tools/windows.js"></script>
  <script src="js/tools/calculator.js"></script>
  <script src="js/tools/dictionary.js"></script>
  <script src="js/tools/reference.js"></script>
  <script src="js/tools/scratchpad.js"></script>
  <script src="js/tools/annotate.js"></script>
  <script src="js/tools/misc.js"></script>

  <script src="js/runner.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/views.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
