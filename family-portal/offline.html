<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline · Family Portal</title>
  <meta name="theme-color" content="#fff8f1">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fff8f1;
      --card: #ffffff;
      --text: #2b2118;
      --muted: #6b5b4d;
      --primary: #f26b3a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15110e;
        --card: #211b16;
        --text: #f7eee5;
        --muted: #cdbcaa;
        --primary: #ff7d4d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }
    main {
      max-width: 380px;
      padding: 32px 24px;
      border-radius: 24px;
      background: var(--card);
      box-shadow: 0 18px 50px rgba(80, 44, 16, 0.16);
    }
    img { width: 84px; height: 84px; margin: 0 auto 16px; display: block; border-radius: 22px; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { margin: 0; color: var(--muted); line-height: 1.5; }
    button {
      margin-top: 20px;
      min-height: 46px;
      padding: 0 22px;
      border: 0;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon.svg" alt="">
    <h1>You're offline</h1>
    <p>Family Portal needs an internet connection the first time it opens. Reconnect and try again. After that, the app will start even without a signal.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
