# Temporary diagnostic workflow; removed after the data sources are chosen.
name: Invest data probe
on:
  push:
    paths:
      - 'invest/scripts/probe.*'
      - '.github/workflows/invest-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node invest/scripts/probe.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yfinance curl_cffi && python invest/scripts/probe.py
